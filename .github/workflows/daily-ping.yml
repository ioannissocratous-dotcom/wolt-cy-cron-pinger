name: Daily snapshot ping (backup)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cy-daily-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger campaign snapshot if missing
        env:
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
        run: |
          set -euo pipefail
          TODAY=$(TZ=Asia/Nicosia date +%Y-%m-%d)
          echo "Cyprus date: ${TODAY}"
          if gh api "repos/boltable/campaigns-diary/contents/snapshots/${TODAY}.json" &>/dev/null; then
            echo "Snapshot ${TODAY} already exists — skip."
            exit 0
          fi
          echo "No snapshot for ${TODAY} — dispatching…"
          gh api --method POST \
            repos/ioannissocratous-dotcom/wolt-cy-campaigns-cron/dispatches \
            -f event_type=daily-snapshot
